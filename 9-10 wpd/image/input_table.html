<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
<style>
    table{
        width: 70%;
        background-color: aqua;
    }
    th{
        text-align: left;
    }
</style>


</head>
<body>
<table border="1">
<tr>
    <th>F Name :</th>
    <td><input type="text"></td>
</tr>
<tr>
    <th>L Name :</th>
    <td><input type="text"></td>
</tr>
<tr>
    <th>Date of Birth: </th>
    <td><input type="date"></td>
</tr>
<tr>
    <th>Address :</th>
    <td><textarea ></textarea></td>
</tr>
<tr>
    <th> Gender</th>
    <td>
        <input type="radio" name="gender" id="gender" value="Male">Male
        <input type="radio" name="gender" id="gender" value="female">Female
    </td>
</tr>

<tr>
    <th>Deegry :</th>
    <td>
        <select>
            <option>Select Deegry</option>
            <option>Bsc</option>
            <option>Bca</option>
            <option>Bba</option>
        </select>
    </td>
</tr>
<tr>
<th>Language know :</th>
<td>
    <input type="checkbox" name="language" id="language">Hindi
    <input type="checkbox" name="language" id="language">Gujarati
    <input type="checkbox" name="language" id="language">English
</td>
</tr>
<tr>
    <th>Email Id :</th>
    <td><input type="email" placeholder="Enter your Email"></td>
</tr>
<tr>
    <th>User Name :</th>
    <td><input type="text" placeholder="Enter your User name"></td>
</tr>
<tr>
    <th>Password :</th>
    <td><input type="password" placeholder="Password"></td>
</tr>
<tr>
    <th>Phone No :</th>
    <td><input type="number"></td>
</tr>
<tr>
    <th>Upload Photo:</th>
    <td><input type="file"></td>
</tr>


<tr>
    <td colspan="2" style="text-align: center;"><input type="submit">
    <input type="reset"></td>
</tr>

</table>   
</body>
</html>
