<!DOCTYPE html>
<html lang="en">
<head>
<title>table 2</title>
<style>
    h1{
        color: rgb(30, 33, 121);
        font-size: 3rem;
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    }
    table,tr,td,th{
        border: 1px solid black;
        border-collapse: collapse;
    }
th,td{
    height:2rem ;width: 10rem;
    text-align: center;
}
tr:nth-child(odd){
    background-color: blanchedalmond;
}
th{
    background-color: aquamarine;
}
tr:nth-child(even){
    background-color: rgb(180, 131, 227);
}
</style>
</head>
<body>
    <h1>Table 1</h1>
    <table>
<tr>
    <th>Name</th>
    <th>Favorite color</th>
</tr>
<tr>
<td>Bob</td>
<td>Yellow</td>
</tr>
<tr>
    <td>Michelle</td>
    <td>Purple</td>
</tr>
    </table>

    
</body>
</html>
