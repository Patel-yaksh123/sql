<!DOCTYPE html>
<html lang="en">
    <style>
        table{
            border: 1px solid black;
            width: 70%;
            border-radius: 10px;
            text-align: center;
         
        }
        tr,th,td{
            border: 1px solid black;
            border-radius: 5px;
        }
        .lab{
            background-color: aquamarine;
        }
    </style>
<head>
  
    <title>Time Table</title>
</head>
<body>
    <table>
        <tr>
            <th>Day/Period</th>
            <th>9:30<br>10:20</th>
            <th>10:20<br>11:10</th>
            <th>11:10<br>12:00</th>
            <th>12:00<br>12:40</th>
            <th>12:40<br>1:30</th>
            <th>1:30<br>2:20</th>
            <th>2:20<br>3:10</th>
            <th>3:10<br>4:00</th>
        </tr>
        <tr>
            <th>Monday</th>
            <td>Eng</td>
            <td>Math</td>
            <td>Che</td>
            <td rowspan="5">Lunch</td>
            <td colspan="3" class="lab">LAB</td>
            <td>Phy</td>
        </tr>
        <tr>
            <th>Tuesday</th>
            <td colspan="3" class="lab">LAB</td>
            <td>Eng</td>
            <td>Che</td>
            <td>Math</td>
            <td>Sports</td>
        </tr>
        <tr>
            <th>Wednesday</th>
            <td>Math</td>
            <td>Phy</td>
            <td>Eng</td>
            <td>Che</td>
            <td colspan="3">LIBRARY</td>
        </tr>
        <tr>
            <th>Thursday</th>
            <td>Phy</td>
            <td>Eng</td>
            <td>Che</td>
            <td colspan="3" class="lab">LAB</td>
            <td>Math</td>
        </tr>
        <tr>
            <th>Friday</th>
            <td>Phy</td>
            <td>Eng</td>
            <td>Che</td>
            <td colspan="3" class="lab">LAB</td>
            <td>Math</td>
        </tr>

    </table>

    
</body>
</html>
